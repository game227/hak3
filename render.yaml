services:
  - type: web
    name: quietspace-tashkent
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    plan: free
    region: frankfurt
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: TIME_ZONE
        value: "Asia/Tashkent"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: quietspace-db
          property: connectionString

databases:
  - name: quietspace-db
    databaseName: quietspace_db
    user: quietspace_user
    plan: free
    region: frankfurt
